  /api/clusters/{clusterName}/actions/analyze-all-tables/{persistent}:
    post:
      consumes:
      - application/json
      description: This endpoint triggers the analyze calculation for all tables in
        the specified cluster.
      parameters:
      - default: Bearer <Add access token here>
        description: Insert your access token
        in: header
        name: Authorization
        required: true
        type: string
      - description: Cluster Name
        in: path
        name: clusterName
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Successfully triggered analyze calculation for all tables
          schema:
            type: string
        "403":
          description: No valid ACL
          schema:
            type: string
        "500":
          description: No cluster
          schema:
            type: string
      summary: Calculate analyze for all tables in a specific cluster
      tags:
      - ClusterSchema
  /api/clusters/{clusterName}/actions/cancel-rolling-reprov:
    post:
      consumes:
      - application/json
      description: This endpoint cancels the rolling reprovision for the specified
        cluster.
      parameters:
      - default: Bearer <Add access token here>
        description: Insert your access token
        in: header
        name: Authorization
        required: true
        type: string
      - description: Cluster Name
        in: path
        name: clusterName
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Successfully cancelled rolling reprovision
          schema:
            type: string
        "403":
          description: No valid ACL
          schema:
            type: string
        "500":
          description: No cluster
          schema:
            type: string
      summary: Cancel rolling reprovision for a specific cluster
      tags:
      - ClusterProvision
  /api/clusters/{clusterName}/actions/cancel-rolling-restart:
    post:
