        required: true
        type: string
      - description: Port
        in: path
        name: port
        required: true
        type: string
      - description: Type
        in: path
        name: type
        type: string
      - description: Tag
        in: path
        name: tag
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Monitor added
          schema:
            type: string
        "403":
          description: No valid ACL
          schema:
            type: string
        "409":
          description: Error adding new monitor
          schema:
            type: string
        "500":
          description: Cluster Not Found
          schema:
            type: string
