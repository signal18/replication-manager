          On Windows, this is a SID in a string format.
          On Plan 9, this is the contents of /dev/user.
        type: string
      homeDir:
        description: HomeDir is the path to the user's home directory (if they have
          one).
        type: string
      name:
        description: |-
          Name is the user's real or display name.
          It might be blank.
          On POSIX systems, this is the first (or only) entry in the GECOS field
          list.
          On Windows, this is the user's display name.
          On Plan 9, this is the contents of /dev/user.
        type: string
      uid:
        description: |-
          Uid is the user ID.
          On POSIX systems, this is a decimal number representing the uid.
          On Windows, this is a security identifier (SID) in a string format.
          On Plan 9, this is the contents of /dev/user.
        type: string
      username:
        description: Username is the login name.
        type: string
    type: object
info:
  contact: {}
paths:
  /api/clusters:
    get:
      description: Fetches the list of clusters that the user has access to based
        on ACL.
      parameters:
      - default: Bearer <Add access token here>
        description: Insert your access token
        in: header
        name: Authorization
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: List of clusters
          schema:
            items:
              $ref: '#/definitions/cluster.Cluster'
            type: array
        "401":
          description: Unauthenticated resource
          schema:
            type: string
        "500":
          description: Internal server error
          schema:
            type: string
      summary: Fetch clusters
      tags:
      - Cluster
  /api/clusters/{clusterName}:
    get:
      description: This endpoint retrieves the details of a specified cluster and
        returns it in JSON format.
      parameters:
      - default: Bearer <Add access token here>
        description: Insert your access token
        in: header
        name: Authorization
        required: true
        type: string
      - description: Cluster Name
        in: path
        name: clusterName
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Cluster details
          schema:
            $ref: '#/definitions/cluster.Cluster'
        "403":
          description: No valid ACL
          schema:
            type: string
        "500":
          description: No cluster
          schema:
            type: string
      summary: Retrieve details of a cluster
      tags:
      - Cluster
  /api/clusters/{clusterName}/actions/add/{clusterShardingName}:
    post:
      consumes:
      - application/json
      description: This endpoint adds a sharding cluster to an existing cluster and
        triggers a rolling restart.
      parameters:
      - default: Bearer <Add access token here>
        description: Insert your access token
        in: header
        name: Authorization
        required: true
        type: string
      - description: Cluster Name
        in: path
        name: clusterName
        required: true
        type: string
      - description: Cluster Sharding Name
        in: path
        name: clusterShardingName
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Sharding cluster added successfully
          schema:
            type: string
        "403":
          description: No valid ACL
          schema:
            type: string
        "500":
          description: No cluster
          schema:
            type: string
      summary: Add a sharding cluster to an existing cluster
      tags:
      - ClusterTopology
  /api/clusters/{clusterName}/actions/addserver/{host}/{port}:
    post:
      consumes:
      - application/json
      description: This endpoint adds a server to the specified cluster.
      parameters:
      - default: Bearer <Add access token here>
        description: Insert your access token
        in: header
        name: Authorization
        required: true
        type: string
      - description: Cluster Name
        in: path
        name: clusterName
        required: true
        type: string
      - description: Host
        in: path
        name: host
        required: true
        type: string
      - description: Port
        in: path
        name: port
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Monitor added
          schema:
            type: string
        "403":
          description: No valid ACL
          schema:
            type: string
        "409":
          description: Error adding new monitor
          schema:
            type: string
        "500":
          description: Cluster Not Found
          schema:
            type: string
      summary: Add a server to a specific cluster
      tags:
      - ClusterMonitor
  /api/clusters/{clusterName}/actions/addserver/{host}/{port}/{type}:
    post:
      consumes:
      - application/json
      description: This endpoint adds a server to the specified cluster.
      parameters:
      - default: Bearer <Add access token here>
        description: Insert your access token
        in: header
        name: Authorization
        required: true
        type: string
      - description: Cluster Name
        in: path
        name: clusterName
        required: true
        type: string
      - description: Host
        in: path
        name: host
        required: true
        type: string
      - description: Port
        in: path
        name: port
        required: true
        type: string
      - description: Type
        in: path
        name: type
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Monitor added
          schema:
            type: string
        "403":
          description: No valid ACL
          schema:
            type: string
        "409":
          description: Error adding new monitor
          schema:
            type: string
        "500":
          description: Cluster Not Found
          schema:
            type: string
      summary: Add a server to a specific cluster
      tags:
      - ClusterMonitor
  /api/clusters/{clusterName}/actions/addserver/{host}/{port}/{type}/{tag}:
    post:
      consumes:
      - application/json
      description: This endpoint adds a server to the specified cluster.
      parameters:
      - default: Bearer <Add access token here>
        description: Insert your access token
        in: header
        name: Authorization
        required: true
        type: string
      - description: Cluster Name
        in: path
        name: clusterName
        required: true
        type: string
      - description: Host
        in: path
