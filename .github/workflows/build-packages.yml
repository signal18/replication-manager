name: Build and Publish Packages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g. v3.1.21). Defaults to latest tag.'
        required: false
        default: ''

# Match Jenkins concurrentBuild: false — queue builds, don't cancel
concurrency:
  group: build-packages
  cancel-in-progress: false

jobs:
  build-and-publish:
    name: Build Linux Packages and Publish Repos
    runs-on: [self-hosted, linux, x64]

    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout tag (manual trigger only)
        if: github.event_name == 'workflow_dispatch'
        run: |
          tag="${{ github.event.inputs.tag }}"
          if [ -z "$tag" ]; then
            tag=$(git describe --tags --abbrev=0)
          fi
          echo "Checking out $tag"
          git checkout "$tag"

      - name: Set up Go 1.24
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install nfpm
        run: |
          if ! command -v nfpm &>/dev/null; then
            NFPM_VER=$(curl -s https://api.github.com/repos/goreleaser/nfpm/releases/latest | grep '"tag_name"' | cut -d'"' -f4)
            NFPM_VER_CLEAN="${NFPM_VER#v}"
            ARCH=$(uname -m | sed 's/aarch64/arm64/')
            mkdir -p "$HOME/.local/bin"
            curl -sfL "https://github.com/goreleaser/nfpm/releases/download/${NFPM_VER}/nfpm_${NFPM_VER_CLEAN}_Linux_${ARCH}.tar.gz" | tar xz -C "$HOME/.local/bin" nfpm
            echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          fi

      # Replaces Jenkins ws-cleanup pre-build step
      - name: Clean build artifacts
        run: rm -rf build/

      - name: Build packages (amd64)
        run: |
          branch="${GITHUB_REF_NAME}"
          mkdir -p /builds/"$branch"
          bash -x ./package_linux.sh
          mv build/release/* /builds/"$branch"/

      - name: Build packages (arm64)
        run: |
          branch="${GITHUB_REF_NAME}"
          export architecture=arm64
          bash -x ./package_linux.sh
          mv build/release/* /builds/"$branch"/

      - name: Publish DEB repo
        run: |
          tag=$(git describe --tags --abbrev=0)
          cleantag="${tag:1}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            docker run --rm \
              -v /root/.gnupg:/root/.gnupg \
              -v /home/repo:/home/repo \
              -v /builds:/builds \
              signal18/reprepro:latest develop "$cleantag"
          else
            docker run --rm \
              -v /root/.gnupg:/root/.gnupg \
              -v /home/repo:/home/repo \
              -v /builds:/builds \
              signal18/reprepro:latest "$cleantag"
          fi

      - name: Publish RPM repo
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            /usr/local/bin/rpmrepo.sh develop
          else
            /usr/local/bin/rpmrepo.sh
          fi

      # Mattermost: notify on success
      - name: Notify Mattermost (success)
        if: success()
        uses: mattermost/action-mattermost-notify@2.0.0
        with:
          MATTERMOST_WEBHOOK_URL: ${{ secrets.MATTERMOST_WEBHOOK_URL }}
          TEXT: |
            :white_check_mark: **Build succeeded** — `${{ github.repository }}` @ `${{ github.ref_name }}`
            Triggered by: ${{ github.actor }}

      # Mattermost: notify on cancelled (aborted)
      - name: Notify Mattermost (cancelled)
        if: cancelled()
        uses: mattermost/action-mattermost-notify@2.0.0
        with:
          MATTERMOST_WEBHOOK_URL: ${{ secrets.MATTERMOST_WEBHOOK_URL }}
          TEXT: |
            :warning: **Build cancelled** — `${{ github.repository }}` @ `${{ github.ref_name }}`
            Triggered by: ${{ github.actor }}

      # Mattermost: notify on failure
      - name: Notify Mattermost (failure)
        if: failure()
        uses: mattermost/action-mattermost-notify@2.0.0
        with:
          MATTERMOST_WEBHOOK_URL: ${{ secrets.MATTERMOST_WEBHOOK_URL }}
          TEXT: |
            :x: **Build failed** — `${{ github.repository }}` @ `${{ github.ref_name }}`
            Triggered by: ${{ github.actor }}
            [View run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

