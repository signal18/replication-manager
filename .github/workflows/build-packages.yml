name: Build and Publish Packages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g. v3.1.21). Defaults to latest tag.'
        required: false
        default: ''

# Match Jenkins concurrentBuild: false — queue builds, don't cancel
concurrency:
  # Shared with docker-build-push.yml build-nightly: the release publisher and the
  # nightly publisher must never push to the plugin-signer repo concurrently.
  # (Also still serializes release-vs-release re-dispatch, as before.)
  group: plugin-signer-publish
  cancel-in-progress: false

jobs:
  build:
    name: Build Linux Packages
    runs-on: [self-hosted, linux, x64]
    outputs:
      tag: ${{ steps.buildtag.outputs.tag }}

    # amd64 + arm64 build takes ~15 min; the publish is its own job below.
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true

      - name: Checkout tag (manual trigger only)
        if: github.event_name == 'workflow_dispatch'
        run: |
          tag="${{ github.event.inputs.tag }}"
          if [ -z "$tag" ]; then
            tag=$(git describe --tags --abbrev=0)
          fi
          echo "Checking out $tag"
          git checkout "$tag"

      # On workflow_dispatch GITHUB_REF_NAME is 'develop' while the publish
      # steps read /builds/v<tag> — resolve the checked-out tag once and use
      # it everywhere so built artifacts and published artifacts always match.
      - name: Resolve build tag
        id: buildtag
        run: echo "tag=$(git describe --tags --exact-match 2>/dev/null || echo "${GITHUB_REF_NAME}")" >> "$GITHUB_OUTPUT"

      - name: Set up Go 1.25
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install nfpm
        run: |
          if ! command -v nfpm &>/dev/null; then
            NFPM_VER=$(curl -s https://api.github.com/repos/goreleaser/nfpm/releases/latest | grep '"tag_name"' | cut -d'"' -f4)
            NFPM_VER_CLEAN="${NFPM_VER#v}"
            ARCH=$(uname -m | sed 's/aarch64/arm64/')
            mkdir -p "$HOME/.local/bin"
            curl -sfL "https://github.com/goreleaser/nfpm/releases/download/${NFPM_VER}/nfpm_${NFPM_VER_CLEAN}_Linux_${ARCH}.tar.gz" | tar xz -C "$HOME/.local/bin" nfpm
            echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          fi

      # Replaces Jenkins ws-cleanup pre-build step
      - name: Clean build artifacts
        run: rm -rf build/

      - name: Build packages (amd64)
        env:
          PLUGIN_SIGNER_USER: ${{ secrets.PLUGIN_SIGNER_USER }}
          PLUGIN_SIGNER_TOKEN: ${{ secrets.PLUGIN_SIGNER_TOKEN }}
          # SINGLE PUBLISHER of the signed plugin set. This tag-triggered package
          # build already compiles every arch (amd64 then arm64) sequentially in one
          # job, so it covers all arches with no concurrent push / no ref race. All
          # other builds (docker/nightly/dev/osc/slim) leave PLUGIN_PUSH unset -> skip
          # (opt-in gate in the Makefile 'plugins' target).
          PLUGIN_PUSH: "ON"
        run: |
          echo "::add-mask::${PLUGIN_SIGNER_USER}:${PLUGIN_SIGNER_TOKEN}"
          branch="${{ steps.buildtag.outputs.tag }}"
          mkdir -p /builds/"$branch"
          bash -x ./package_linux.sh
          mv build/release/* /builds/"$branch"/

      - name: Build packages (arm64)
        env:
          PLUGIN_SIGNER_USER: ${{ secrets.PLUGIN_SIGNER_USER }}
          PLUGIN_SIGNER_TOKEN: ${{ secrets.PLUGIN_SIGNER_TOKEN }}
          # SINGLE PUBLISHER of the signed plugin set. This tag-triggered package
          # build already compiles every arch (amd64 then arm64) sequentially in one
          # job, so it covers all arches with no concurrent push / no ref race. All
          # other builds (docker/nightly/dev/osc/slim) leave PLUGIN_PUSH unset -> skip
          # (opt-in gate in the Makefile 'plugins' target).
          PLUGIN_PUSH: "ON"
        run: |
          echo "::add-mask::${PLUGIN_SIGNER_USER}:${PLUGIN_SIGNER_TOKEN}"
          branch="${{ steps.buildtag.outputs.tag }}"
          export architecture=arm64
          bash -x ./package_linux.sh
          mv build/release/* /builds/"$branch"/

      # The packages go to the publish job through an artifact: the publisher runs
      # where the package repo is served, not on this build host.
      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: packages-${{ steps.buildtag.outputs.tag }}
          path: /builds/${{ steps.buildtag.outputs.tag }}/
          compression-level: 0
          retention-days: 3
          if-no-files-found: error

  publish:
    name: Publish DEB and RPM Repos
    needs: build
    # The runner of the package repo service: it publishes into the copy that
    # repo.signal18.io serves (publish-repo is provided by that runner).
    runs-on: [repo-publish]
    timeout-minutes: 30
    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          name: packages-${{ needs.build.outputs.tag }}
          path: ${{ runner.temp }}/packages

      - name: Publish
        run: publish-repo "${{ needs.build.outputs.tag }}" "${{ runner.temp }}/packages"

  notify:
    name: Notify Mattermost
    needs: [build, publish]
    if: always()
    runs-on: ubuntu-latest
    steps:
      # Mattermost: notify on success
      - name: Notify Mattermost (success)
        if: needs.build.result == 'success' && needs.publish.result == 'success'
        uses: mattermost/action-mattermost-notify@2.0.0
        with:
          MATTERMOST_WEBHOOK_URL: ${{ secrets.MATTERMOST_WEBHOOK_URL }}
          TEXT: |
            :white_check_mark: **Build succeeded** — `${{ github.repository }}` @ `${{ github.ref_name }}`
            Triggered by: ${{ github.actor }}

      # Mattermost: notify on cancelled (aborted)
      - name: Notify Mattermost (cancelled)
        if: needs.build.result == 'cancelled' || needs.publish.result == 'cancelled'
        uses: mattermost/action-mattermost-notify@2.0.0
        with:
          MATTERMOST_WEBHOOK_URL: ${{ secrets.MATTERMOST_WEBHOOK_URL }}
          TEXT: |
            :warning: **Build cancelled** — `${{ github.repository }}` @ `${{ github.ref_name }}`
            Triggered by: ${{ github.actor }}

      # Mattermost: notify on failure
      - name: Notify Mattermost (failure)
        if: needs.build.result == 'failure' || needs.publish.result == 'failure'
        uses: mattermost/action-mattermost-notify@2.0.0
        with:
          MATTERMOST_WEBHOOK_URL: ${{ secrets.MATTERMOST_WEBHOOK_URL }}
          TEXT: |
            :x: **Build failed** — `${{ github.repository }}` @ `${{ github.ref_name }}`
            Triggered by: ${{ github.actor }}
            [View run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

