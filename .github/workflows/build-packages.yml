name: Build and Publish Packages

on:
  push:
    tags:
      - 'v*'
    branches:
      - develop
      - '2.[0-9]'
      - '2.2'
  workflow_dispatch:

# Match Jenkins concurrentBuild: false — queue builds, don't cancel
concurrency:
  group: build-packages
  cancel-in-progress: false

jobs:
  build-and-publish:
    name: Build Linux Packages and Publish Repos
    runs-on: [self-hosted, linux, x64]

    # Match Jenkins inactivity timeout of 360s
    timeout-minutes: 6

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go 1.24
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      # Replaces Jenkins ws-cleanup pre-build step
      - name: Clean build artifacts
        run: rm -rf build/

      - name: Build packages (amd64)
        run: |
          branch="${GITHUB_REF_NAME}"
          mkdir -p /builds/"$branch"
          bash -x ./package_linux.sh
          mv build/release/* /builds/"$branch"/

      - name: Build packages (arm64)
        run: |
          branch="${GITHUB_REF_NAME}"
          export architecture=arm64
          bash -x ./package_linux.sh
          mv build/release/* /builds/"$branch"/

      - name: Publish DEB repo
        run: |
          tag=$(git describe --tags --abbrev=0)
          cleantag="${tag:1}"
          docker run --rm \
            -v /root/.gnupg:/root/.gnupg \
            -v /home:/home \
            signal18/reprepro:latest "$cleantag"

      - name: Publish RPM repo
        run: /usr/local/bin/rpmrepo.sh

      # Mattermost: notify on success
      - name: Notify Mattermost (success)
        if: success()
        uses: mattermost/action-mattermost-notify@v2
        with:
          MATTERMOST_WEBHOOK_URL: ${{ secrets.MATTERMOST_WEBHOOK_URL }}
          TEXT: |
            :white_check_mark: **Build succeeded** — `${{ github.repository }}` @ `${{ github.ref_name }}`
            Triggered by: ${{ github.actor }}

      # Mattermost: notify on cancelled (aborted)
      - name: Notify Mattermost (cancelled)
        if: cancelled()
        uses: mattermost/action-mattermost-notify@v2
        with:
          MATTERMOST_WEBHOOK_URL: ${{ secrets.MATTERMOST_WEBHOOK_URL }}
          TEXT: |
            :warning: **Build cancelled** — `${{ github.repository }}` @ `${{ github.ref_name }}`
            Triggered by: ${{ github.actor }}

      # Slack: notify on failure
      - name: Notify Slack (failure)
        if: failure()
        uses: slackapi/slack-github-action@v2
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "channel": "replication-manager",
              "text": ":x: *Build failed* — `${{ github.repository }}` @ `${{ github.ref_name }}`\nTriggered by: ${{ github.actor }}\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View run>"
            }

      # Slack: notify on cancelled (aborted)
      - name: Notify Slack (cancelled)
        if: cancelled()
        uses: slackapi/slack-github-action@v2
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "channel": "replication-manager",
              "text": ":warning: *Build cancelled* — `${{ github.repository }}` @ `${{ github.ref_name }}`\nTriggered by: ${{ github.actor }}\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View run>"
            }
