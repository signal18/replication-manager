          cache-to: type=gha,mode=max,scope=dev-rootless

      - name: Notify failure (Mattermost)
        if: failure() && vars.MATTERMOST_WEBHOOK_URL != ''
        env:
          WORKFLOW_NAME: ${{ github.workflow }}
          RUN_NUMBER: ${{ github.run_number }}
          REF_NAME: ${{ github.ref_name }}
          SERVER_URL: ${{ github.server_url }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          WEBHOOK_URL: ${{ vars.MATTERMOST_WEBHOOK_URL }}
        run: |
          curl -X POST -H 'Content-Type: application/json' \
            --data "{\"text\":\":x: Docker DEV Rootless build failed!\n**Job:** \`${WORKFLOW_NAME}\`\n**Build:** \`${RUN_NUMBER}\`\n**Branch/Tag:** \`${REF_NAME}\`\n[View Run](${SERVER_URL}/${REPO}/actions/runs/${RUN_ID})\"}" \
            "$WEBHOOK_URL"

  # Arbitrator - Only on tags
  build-arb:
    name: Build Arbitrator Edition
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || inputs.force_build || inputs.tag != ''
