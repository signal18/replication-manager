          file: docker/Dockerfile.pro
          push: true
          tags: signal18/replication-manager:${{ steps.tag.outputs.tag }}-pro
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=pro
          cache-to: type=gha,mode=max,scope=pro

      - name: Notify failure (Mattermost)
