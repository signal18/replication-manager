            "$WEBHOOK_URL"

  # PRO Rootless - Only on tags
  build-pro-rootless:
    name: Build PRO Rootless Edition
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || inputs.force_build || inputs.tag != ''
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract tag name
        id: tag
        env:
