        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract tag name (if exists)
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [[ -n "$INPUT_TAG" ]]; then
            echo "tag=$INPUT_TAG" >> $GITHUB_OUTPUT
            echo "is_tag=true" >> $GITHUB_OUTPUT
          elif [[ $GITHUB_REF == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
            echo "is_tag=true" >> $GITHUB_OUTPUT
          else
            echo "is_tag=false" >> $GITHUB_OUTPUT
          fi

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: signal18/replication-manager
          tags: |
            type=raw,value=dev
            type=semver,pattern={{version}}-dev,enable=${{ steps.tag.outputs.is_tag == 'true' }}

      - name: Build tags list
        id: tags
        env:
          IS_TAG: ${{ steps.tag.outputs.is_tag }}
          TAG_NAME: ${{ steps.tag.outputs.tag }}
        run: |
          TAGS="signal18/replication-manager:dev"
          if [[ "$IS_TAG" == "true" ]]; then
            TAGS="${TAGS},signal18/replication-manager:${TAG_NAME}-dev"
          fi
          echo "tags=${TAGS}" >> $GITHUB_OUTPUT

      - name: Build and push DEV
        uses: docker/build-push-action@v5
