          fi

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: signal18/replication-manager
          tags: |
            type=semver,pattern={{version}}-pro

      - name: Build and push PRO
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.pro
          push: true
          tags: signal18/replication-manager:${{ steps.tag.outputs.tag }}-pro
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            PLUGIN_SIGNER_USER=${{ secrets.PLUGIN_SIGNER_USER }}
            PLUGIN_SIGNER_TOKEN=${{ secrets.PLUGIN_SIGNER_TOKEN }}
          cache-from: type=gha,scope=pro
          cache-to: type=gha,mode=max,scope=pro

      - name: Notify failure (Mattermost)
        if: failure() && vars.MATTERMOST_WEBHOOK_URL != ''
        env:
          WORKFLOW_NAME: ${{ github.workflow }}
          RUN_NUMBER: ${{ github.run_number }}
          REF_NAME: ${{ github.ref_name }}
          SERVER_URL: ${{ github.server_url }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          WEBHOOK_URL: ${{ vars.MATTERMOST_WEBHOOK_URL }}
        run: |
          curl -X POST -H 'Content-Type: application/json' \
