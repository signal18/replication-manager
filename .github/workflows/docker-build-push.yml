            ${{ vars.MATTERMOST_WEBHOOK_URL }}

  # PRO Rootless - Only on tags
  build-pro-rootless:
    name: Build PRO Rootless Edition
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || inputs.force_build
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false

      - name: Set up Docker Buildx
