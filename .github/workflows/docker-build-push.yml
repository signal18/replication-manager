        run: |
          curl -X POST -H 'Content-Type: application/json' \
            --data "{\"text\":\":x: Docker ARB build failed!\n**Job:** \`${WORKFLOW_NAME}\`\n**Build:** \`${RUN_NUMBER}\`\n**Branch/Tag:** \`${REF_NAME}\`\n[View Run](${SERVER_URL}/${REPO}/actions/runs/${RUN_ID})\"}" \
