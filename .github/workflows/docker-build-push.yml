          TAG_NAME: ${{ steps.tag.outputs.tag }}
        run: |
          TAGS="signal18/replication-manager:dev-rootless"
          if [[ "$IS_TAG" == "true" ]]; then
            TAGS="${TAGS},signal18/replication-manager:${TAG_NAME}-dev-rootless"
          fi
          echo "tags=${TAGS}" >> $GITHUB_OUTPUT

      - name: Build and push DEV Rootless
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.dev_rootless
          push: true
          tags: ${{ steps.tags.outputs.tags }}
