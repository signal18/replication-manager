name: Docker Build and Push

on:
  push:
    branches:
      - develop
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      force_build:
        description: 'Force build all images (including tag-only)'
        required: false
        type: boolean
        default: false
      tag:
        description: 'Tag to build (e.g. v2.3.0). Use this instead of selecting a tag in the ref dropdown.'
        required: false
        type: string
        default: ''

# Prevent concurrent builds
concurrency:
  group: docker-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Detect relevant file changes for branch pushes
  detect-changes:
    name: Detect Changed Files
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            relevant:
              - '**/*.go'
              - 'Dockerfile*'
              - 'docker/Dockerfile*'
              - 'docker/arb/**'
              - 'Makefile'
              - 'share/**'
              - 'etc/**'
              - '.github/workflows/**'

  # OSC (Open Source Community) - Only on tags
  build-osc:
    name: Build OSC Edition
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || inputs.force_build || inputs.tag != ''
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract tag name
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [[ -n "$INPUT_TAG" ]]; then
            echo "tag=$INPUT_TAG" >> $GITHUB_OUTPUT
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: signal18/replication-manager
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest

      - name: Build and push OSC
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: |
            signal18/replication-manager:${{ steps.tag.outputs.tag }}
            signal18/replication-manager:latest
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            PLUGIN_SIGNER_USER=${{ secrets.PLUGIN_SIGNER_USER }}
            PLUGIN_SIGNER_TOKEN=${{ secrets.PLUGIN_SIGNER_TOKEN }}
          cache-from: type=gha,scope=osc
          cache-to: type=gha,mode=max,scope=osc

      - name: Notify failure (Mattermost)
        if: failure() && vars.MATTERMOST_WEBHOOK_URL != ''
        env:
          WORKFLOW_NAME: ${{ github.workflow }}
          RUN_NUMBER: ${{ github.run_number }}
          REF_NAME: ${{ github.ref_name }}
          SERVER_URL: ${{ github.server_url }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          WEBHOOK_URL: ${{ vars.MATTERMOST_WEBHOOK_URL }}
        run: |
          curl -X POST -H 'Content-Type: application/json' \
            --data "{\"text\":\":x: Docker OSC build failed!\n**Job:** \`${WORKFLOW_NAME}\`\n**Build:** \`${RUN_NUMBER}\`\n**Branch/Tag:** \`${REF_NAME}\`\n[View Run](${SERVER_URL}/${REPO}/actions/runs/${RUN_ID})\"}" \
            "$WEBHOOK_URL"

  # OSC Rootless - Only on tags
  build-osc-rootless:
    name: Build OSC Rootless Edition
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || inputs.force_build || inputs.tag != ''
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract tag name
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [[ -n "$INPUT_TAG" ]]; then
            echo "tag=$INPUT_TAG" >> $GITHUB_OUTPUT
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: signal18/replication-manager
          tags: |
            type=semver,pattern={{version}}-rootless
            type=raw,value=latest-rootless

      - name: Build and push OSC Rootless
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.rootless
          push: true
          tags: |
            signal18/replication-manager:${{ steps.tag.outputs.tag }}-rootless
            signal18/replication-manager:latest-rootless
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=osc-rootless
          cache-to: type=gha,mode=max,scope=osc-rootless

      - name: Notify failure (Mattermost)
        if: failure() && vars.MATTERMOST_WEBHOOK_URL != ''
        env:
          WORKFLOW_NAME: ${{ github.workflow }}
          RUN_NUMBER: ${{ github.run_number }}
          REF_NAME: ${{ github.ref_name }}
          SERVER_URL: ${{ github.server_url }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          WEBHOOK_URL: ${{ vars.MATTERMOST_WEBHOOK_URL }}
        run: |
          curl -X POST -H 'Content-Type: application/json' \
            --data "{\"text\":\":x: Docker OSC Rootless build failed!\n**Job:** \`${WORKFLOW_NAME}\`\n**Build:** \`${RUN_NUMBER}\`\n**Branch/Tag:** \`${REF_NAME}\`\n[View Run](${SERVER_URL}/${REPO}/actions/runs/${RUN_ID})\"}" \
            "$WEBHOOK_URL"

  # PRO (Professional with OpenSVC) - Only on tags
  build-pro:
    name: Build PRO Edition
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || inputs.force_build || inputs.tag != ''
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true

      - name: Set up Docker Buildx
