      - name: Build and push DEV Rootless
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.dev_rootless
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=dev-rootless
          cache-to: type=gha,mode=max,scope=dev-rootless

      - name: Notify failure (Mattermost)
        if: failure() && vars.MATTERMOST_WEBHOOK_URL != ''
        run: |
          curl -X POST -H 'Content-Type: application/json' \
            --data "{\"text\":\":x: Docker DEV Rootless build failed!\n**Job:** \`${{ github.workflow }}\`\n**Build:** \`${{ github.run_number }}\`\n**Branch/Tag:** \`${{ github.ref_name }}\`\n[View Run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})\"}" \
            ${{ vars.MATTERMOST_WEBHOOK_URL }}

  # SLIM build - Only on tags
  build-slim:
