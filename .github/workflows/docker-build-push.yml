name: Docker Build and Push

on:
  push:
    branches:
      - develop
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      force_build:
        description: 'Force build all images (including tag-only)'
        required: false
        type: boolean
        default: false

# Prevent concurrent builds
concurrency:
  group: docker-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # OSC (Open Source Community) - Only on tags
  build-osc:
    name: Build OSC Edition
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || inputs.force_build
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract tag name
        id: tag
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: signal18/replication-manager
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest

      - name: Build and push OSC
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: |
            signal18/replication-manager:${{ steps.tag.outputs.tag }}
            signal18/replication-manager:latest
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=osc
          cache-to: type=gha,mode=max,scope=osc

      - name: Notify failure (Mattermost)
        if: failure() && vars.MATTERMOST_WEBHOOK_URL != ''
        run: |
          curl -X POST -H 'Content-Type: application/json' \
            --data "{\"text\":\":x: Docker OSC build failed!\n**Job:** \`${{ github.workflow }}\`\n**Build:** \`${{ github.run_number }}\`\n**Branch/Tag:** \`${{ github.ref_name }}\`\n[View Run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})\"}" \
            ${{ vars.MATTERMOST_WEBHOOK_URL }}

  # OSC Rootless - Only on tags
  build-osc-rootless:
    name: Build OSC Rootless Edition
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || inputs.force_build
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract tag name
        id: tag
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: signal18/replication-manager
          tags: |
            type=semver,pattern={{version}}-rootless
            type=raw,value=latest-rootless

      - name: Build and push OSC Rootless
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile_rootless
          push: true
          tags: |
            signal18/replication-manager:${{ steps.tag.outputs.tag }}-rootless
            signal18/replication-manager:latest-rootless
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=osc-rootless
          cache-to: type=gha,mode=max,scope=osc-rootless

      - name: Notify failure (Mattermost)
        if: failure() && vars.MATTERMOST_WEBHOOK_URL != ''
        run: |
          curl -X POST -H 'Content-Type: application/json' \
            --data "{\"text\":\":x: Docker OSC Rootless build failed!\n**Job:** \`${{ github.workflow }}\`\n**Build:** \`${{ github.run_number }}\`\n**Branch/Tag:** \`${{ github.ref_name }}\`\n[View Run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})\"}" \
            ${{ vars.MATTERMOST_WEBHOOK_URL }}

  # PRO (Professional with OpenSVC) - Only on tags
  build-pro:
