name = "backend-service"

docker-img = "my-backend-image:latest"
docker-run-args = "-p 4000:4000"
docker-run-cmd = ""

ports = ["4000:4000"]

[[variables]]
name = "DATABASE_URL"
value = "postgres://user:pass@db:5432/mydb"
type = "env"
agents = ["backend"]

[[variables]]
name = "LOG_LEVEL"
value = "info"
type = "env"
agents = ["backend"]

[[path]]
volumedir = "var"
from = "./config"
to = "/app/config"
type = "direct"
agents = ["backend"]

[[git-clones]]
repo = "https://github.com/example/backend.git"
branch = "main"
dest = "app"
user = "gituser"
pass = "gitpass"
