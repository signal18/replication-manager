name = "load-balancer"

docker-img = "nginx:alpine"
docker-run-args = "-p 80:80"
docker-run-cmd = ""

ports = ["80:80"]

[[variables]]
name = "BACKEND_SERVICE"
value = "backend-service"  # DNS or service name for backend cluster
type = "env"
agents = ["all"]

[[path]]
volumedir = "etc"
from = "./nginx"
to = "/etc/nginx/conf.d"
type = "direct"
agents = ["all"]

[[git-clones]]
repo = "https://github.com/example/nginx-config.git"
branch = "main"
dest = "config"
user = "gituser"
pass = "gitpass"
