name = "haproxy-loadbalancer"

docker-img = "haproxy:2.8-alpine"
docker-run-args = "-p 80:80"
docker-run-cmd = ""

ports = ["80:80"]

[[variables]]
name = "BACKEND_SERVERS"
value = "backend1:4000,backend2:4001,backend3:4002"
type = "env"
agents = ["loadbalancer"]

[[path]]
volumedir = "etc"
from = "./haproxy"
to = "/usr/local/etc/haproxy"
type = "direct"
agents = ["loadbalancer"]

[[git-clones]]
repo = "https://github.com/example/haproxy-config.git"
branch = "main"
dest = "config"
user = "gituser"
pass = "gitpass"
