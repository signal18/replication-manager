name = "frontend-dev"

docker-img = "node:18"  # Node image to run dev server (e.g. Angular, React)
docker-run-args = "-p 3000:3000"  # expose dev server port
docker-run-cmd = "npm start"  # or ng serve for Angular

ports = ["3000:3000"]

[[variables]]
name = "API_BASE_URL"
value = "http://localhost:4000"  # backend dev server url
type = "env"
agents = ["frontend"]

[[path]]
volumedir = "var"
from = "./frontend/src"
to = "/app/src"
type = "direct"
agents = ["frontend"]

[[path]]
volumedir = "var"
from = "./frontend/package.json"
to = "/app/package.json"
type = "direct"
agents = ["frontend"]

[[git-clones]]  # usually not needed in dev if mounting local files
repo = "https://github.com/example/frontend.git"
branch = "dev"
dest = "app"
user = "gituser"
pass = "gitpass"
