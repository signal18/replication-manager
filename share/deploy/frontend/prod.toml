name = "frontend-nginx"

docker-img = "nginx:alpine"
docker-run-args = "-p 80:80"
docker-run-cmd = ""

ports = ["80:80"]

[[variables]]
name = "API_BASE_URL"
value = "http://haproxy-loadbalancer"  # or actual domain e.g. https://api.myapp.com
type = "env"
agents = ["all"]

[[path]]
volumedir = "var"
from = "./dist"
to = "/usr/share/nginx/html"
type = "direct"
agents = ["all"]

[[path]]
volumedir = "etc"
from = "./nginx"
to = "/etc/nginx/conf.d"
type = "direct"
agents = ["all"]

[[git-clones]]
repo = "https://github.com/example/frontend.git"
branch = "main"
dest = "data"
user = "gituser"
pass = "gitpass"
