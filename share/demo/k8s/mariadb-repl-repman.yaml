---
# Secret: MariaDB credentials
apiVersion: v1
kind: Secret
metadata:
  name: repman-credentials
type: Opaque
stringData:
  db-credential: "root:mariadb"
---
# ServiceAccount for repman to access K8s API
apiVersion: v1
kind: ServiceAccount
metadata:
  name: repman
---
# ClusterRole: permissions required by repman to provision MariaDB pods
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: repman-orchestrator
rules:
  - apiGroups: [""]
    resources: [pods, services, namespaces, persistentvolumeclaims, configmaps, nodes]
    verbs: [get, list, create, delete, update, watch]
  - apiGroups: [apps]
    resources: [deployments, statefulsets]
    verbs: [get, list, create, delete, update, watch]
---
# ClusterRoleBinding: bind repman ServiceAccount to the ClusterRole
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: repman-orchestrator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: repman-orchestrator
subjects:
  - kind: ServiceAccount
    name: repman
    namespace: default
---
# Deployment: replication-manager as native K8s orchestrator
apiVersion: apps/v1
kind: Deployment
metadata:
  name: replication-manager
spec:
  replicas: 1
  selector:
    matchLabels:
      app: replication-manager
  template:
    metadata:
      labels:
        app: replication-manager
    spec:
      serviceAccountName: repman
      containers:
        - name: replication-manager
          image: signal18/replication-manager:latest
          ports:
            - name: http
              containerPort: 10001
          env:
            # Global settings
            - name: REPLICATION_MANAGER_DEFAULT_HTTP_SERVER
              value: "true"
            - name: REPLICATION_MANAGER_DEFAULT_HTTP_BIND_ADDRESS
              value: "0.0.0.0"
            - name: REPLICATION_MANAGER_DEFAULT_HTTP_PORT
              value: "10001"
            - name: REPLICATION_MANAGER_DEFAULT_HTTP_BOOTSTRAP_BUTTON
              value: "true"
            - name: REPLICATION_MANAGER_DEFAULT_PROV_ORCHESTRATOR
              value: "kube"
            - name: REPLICATION_MANAGER_DEFAULT_PROV_NET_CNI
              value: "true"
            - name: REPLICATION_MANAGER_DEFAULT_PROV_NET_CNI_CLUSTER
              value: "cluster.local"
            # Cluster settings
            - name: REPLICATION_MANAGER_CLUSTER1_TITLE
              value: "cluster1"
            - name: REPLICATION_MANAGER_CLUSTER1_DB_SERVERS_HOSTS
              value: "db1,db2"
            - name: REPLICATION_MANAGER_CLUSTER1_DB_SERVERS_PREFERED_MASTER
              value: "db1"
            - name: REPLICATION_MANAGER_CLUSTER1_DB_SERVERS_CREDENTIAL
              valueFrom:
                secretKeyRef:
                  name: repman-credentials
                  key: db-credential
            - name: REPLICATION_MANAGER_CLUSTER1_REPLICATION_CREDENTIAL
              valueFrom:
                secretKeyRef:
                  name: repman-credentials
                  key: db-credential
            - name: REPLICATION_MANAGER_CLUSTER1_DB_SERVERS_CONNECT_TIMEOUT
              value: "1"
            - name: REPLICATION_MANAGER_CLUSTER1_PROV_DB_SERVICE_TYPE
              value: "docker"
            - name: REPLICATION_MANAGER_CLUSTER1_PROV_DB_DOCKER_IMG
              value: "mariadb:10.11"
            - name: REPLICATION_MANAGER_CLUSTER1_PROV_DB_TAGS
              value: "semisync,innodb,noquerycache,logslow"
            # Set to your K8s node names, comma-separated.
            # Run: kubectl get nodes -o jsonpath='{range .items[*]}{.metadata.name}{","}{end}'
            - name: REPLICATION_MANAGER_CLUSTER1_PROV_DB_AGENTS
              value: "node1,node2"
---
# Service: NodePort to expose the repman dashboard
apiVersion: v1
kind: Service
metadata:
  name: replication-manager
spec:
  type: NodePort
  selector:
    app: replication-manager
  ports:
    - name: http
      port: 10001
      targetPort: http
      nodePort: 30001
